<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresa - Busca de Profissionais</title>
    <link rel="stylesheet" href="/projeto portifólio/css/style.css">
    <style>
        #lista-oculta li {
            cursor: pointer;
            padding: 5px;
            transition: background 0.3s;
        }

        #lista-oculta li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Encontrar Profissionais</h1>
        </header>
        
        <section id="busca">
            <input type="text" id="pesquisa" placeholder="Buscar por nome ou área de atuação...">
            <button id="buscar">Buscar</button>
        </section>
        
        <ul id="lista-oculta" style="display: none;">
            <li data-nome="Ana Souza" data-area="Designer">Ana Souza - Designer</li>
            <li data-nome="Carlos Lima" data-area="Desenvolvedor Web">Carlos Lima - Desenvolvedor Web</li>
            <li data-nome="Juliana Alves" data-area="Marketing">Juliana Alves - Marketing</li>
            <li data-nome="Fernando Torres" data-area="Analista de Dados">Fernando Torres - Analista de Dados</li>
        </ul>
        
        <section id="listaPerfis">
            <h2>Profissionais Disponíveis</h2>
            <div id="perfis">
                <!-- Perfis serão inseridos dinamicamente -->
            </div>
        </section>

        <footer>
            <p>© 2024 Plataforma de Portfólios</p>
        </footer>
    </div>

    <!-- Script embutido -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputPesquisa = document.getElementById('pesquisa');
            const listaOculta = document.getElementById('lista-oculta');
            const itensOriginais = Array.from(listaOculta.querySelectorAll('li'));

            // Função que redireciona ao clicar no profissional
            function redirecionarParaPerfil(nome) {
                const nomeFormatado = encodeURIComponent(nome.trim());
                window.location.href = `perfil.html?nome=${nomeFormatado}`;
            }

            // Adiciona evento de clique a cada item
            itensOriginais.forEach(item => {
                item.addEventListener('click', () => {
                    const nome = item.dataset.nome;
                    redirecionarParaPerfil(nome);
                });
            });

            inputPesquisa.addEventListener('input', () => {
                const termo = inputPesquisa.value.toLowerCase().trim();

                if (termo === '') {
                    listaOculta.style.display = 'none';
                    return;
                }

                listaOculta.style.display = 'block';
                let algumResultado = false;

                itensOriginais.forEach(item => {
                    const nome = item.dataset.nome.toLowerCase();
                    const area = item.dataset.area.toLowerCase();
                    const corresponde = nome.includes(termo) || area.includes(termo);
                    item.style.display = corresponde ? 'list-item' : 'none';
                    if (corresponde) algumResultado = true;
                });

                if (!algumResultado) {
                    listaOculta.innerHTML = '<li>Nenhum profissional encontrado.</li>';
                } else {
                    listaOculta.innerHTML = '';
                    itensOriginais.forEach(item => {
                        const nome = item.dataset.nome.toLowerCase();
                        const area = item.dataset.area.toLowerCase();
                        if (nome.includes(termo) || area.includes(termo)) {
                            listaOculta.appendChild(item);
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
